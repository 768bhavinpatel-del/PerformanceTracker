<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance & Task Management</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lang-switch select {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .login-card {
            max-width: 400px;
            margin: 80px auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            overflow-x: auto;
            display: block;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            min-width: 140px;
        }

        th {
            background-color: #e9ecef;
            position: sticky;
            top: 0;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }

        .nav-tabs button {
            background: none;
            color: #333;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        .nav-tabs button.active {
            border-bottom: 3px solid var(--secondary-color);
            color: var(--secondary-color);
            font-weight: bold;
        }
        
        .link-btn {
            background: none;
            color: var(--secondary-color);
            border: none;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h2 id="app-title">Performance Sheet Portal</h2>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="lang-switch">
                <label for="languageSelect" style="color:white; margin-right:5px;">🌐</label>
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="gu">ગુજરાતી</option>
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
            </div>
            <button id="logoutBtn" class="hidden btn-danger" onclick="logout()" data-i18n="logout">Logout</button>
        </div>
    </div>

    <div class="container">
        
        <!-- Login Form / Forgot Password Section -->
        <div id="loginSection" class="card login-card">
            <h3 id="loginFormTitle" data-i18n="login">Login</h3>
            
            <div id="loginFields">
                <div class="form-group">
                    <label data-i18n="username">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter Username">
                </div>
                <div class="form-group">
                    <label data-i18n="password">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter Password">
                </div>
                <button style="width: 100%;" onclick="login()" data-i18n="login">Login</button>
                <p style="margin-top: 15px; text-align: right;">
                    <button class="link-btn" onclick="showForgotForm()" data-i18n="forgot_pass_link">Forgot Password?</button>
                </p>
                <p id="loginError" style="color:red; margin-top:10px; display:none;" data-i18n="invalid_login">Invalid Username or Password</p>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgotFields" class="hidden">
                <div class="form-group">
                    <label data-i18n="username">Username</label>
                    <input type="text" id="forgotUsername" placeholder="Enter your Username">
                </div>
                <div class="form-group">
                    <label data-i18n="mobile_or_email">Registered Mobile / Email</label>
                    <input type="text" id="forgotContact" placeholder="Enter Mobile or Email">
                </div>
                <button style="width: 100%;" onclick="resetPassword()" data-i18n="btn_reset">Reset Password</button>
                <p style="margin-top: 15px; text-align: center;">
                    <button class="link-btn" onclick="showLoginForm()" data-i18n="back_to_login">Back to Login</button>
                </p>
                <p id="forgotMsg" style="color:green; margin-top:10px; display:none;"></p>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden">
            <h3 id="welcomeMsg">Welcome</h3>

            <!-- Navigation Tabs (Visible to Admins / Master Admin) -->
            <div id="adminNav" class="nav-tabs hidden">
                <button class="active" onclick="switchTab('userMgmt')" data-i18n="tab_users">User & Admin Management</button>
                <button onclick="switchTab('taskMgmt')" data-i18n="tab_tasks">Master Task List (Col G)</button>
                <button onclick="switchTab('dataSheet')" data-i18n="tab_data">Performance Data Sheet</button>
            </div>

            <!-- TAB 1: User & Admin Rights Management -->
            <div id="userMgmtTab" class="tab-content hidden">
                <div class="card">
                    <h4 data-i18n="add_user">Add User / Admin & Assign Rights</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px;">
                        <input type="text" id="newUsername" placeholder="Username">
                        <input type="password" id="newPassword" placeholder="Password">
                        <input type="text" id="newContact" placeholder="Mobile / Email">
                        <select id="newUserRole">
                            <option value="employee">Employee</option>
                            <option value="admin">Admin</option>
                            <option value="master_admin">Master Admin</option>
                        </select>
                    </div>

                    <h5 style="margin-top: 15px;" data-i18n="select_visible_cols">Select Visible/Editable Columns:</h5>
                    <div class="permissions-grid" id="colPermissions">
                        <!-- Checkboxes generated via JS -->
                    </div>

                    <button style="margin-top: 15px;" onclick="createUser()" data-i18n="btn_create_user">Save User Rights</button>
                </div>
            </div>

            <!-- TAB 2: Task List Management (Col G Master) -->
            <div id="taskMgmtTab" class="tab-content hidden">
                <div class="card">
                    <h4 data-i18n="add_task">Add Master Task (Col G)</h4>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="newTaskName" placeholder="Task Name">
                        <button onclick="addMasterTask()" data-i18n="btn_add_task">Add Task</button>
                    </div>
                    <ul id="masterTaskList" style="margin-top: 15px;"></ul>
                </div>
            </div>

            <!-- TAB 3: Data Sheet -->
            <div id="dataSheetTab" class="tab-content card">
                <h4 data-i18n="performance_sheet">Performance Entry Sheet</h4>
                
                <!-- Admin Task & Salary Assignment Box -->
                <div id="adminActionBox" class="card hidden" style="background: #eef6fc;">
                    <h5 data-i18n="admin_action_title">Admin Panel: Assign Daily Task, Salary & Input Status</h5>
                    <div style="display:flex; gap:10px; flex-wrap: wrap; align-items: center;">
                        <label>Date:</label>
                        <input type="date" id="inputDate" style="width: 140px;">
                        <select id="assignUserSelect"></select>
                        <input type="number" id="inputSalary" placeholder="Salary (Col B)" style="width: 120px;">
                        <select id="assignTaskSelect"></select>
                        <select id="inputStatusSelect">
                            <option value="correct">Correct Selection</option>
                            <option value="incorrect">Incorrect Selection</option>
                        </select>
                        <button onclick="assignDailyTask()" data-i18n="btn_assign">Add Daily Entry</button>
                    </div>
                </div>

                <!-- Main Data Table -->
                <div style="overflow-x:auto;">
                    <table id="performanceTable">
                        <thead>
                            <tr id="tableHeader">
                                <!-- Headers built dynamically -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows generated via JS -->
                        </tbody>
                    </table>
                </div>
                <button style="margin-top: 15px;" onclick="saveSheetData()" data-i18n="btn_save_data">Save Sheet Data</button>
            </div>

        </div>
    </div>

            { dateCol: '2026-06-07', colA: 'Demo', colB: 15000, colC: 1500, colD: 50, colE: 150, colF: 150, colG: 'Task 1', colH: 'Incomplete', colI: 0, colJ: 1, colK: 'correct', colL: 0, colM: 1500, colN: 0, colO: 0, colQ: '', colR: 1 }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            renderPermissionsCheckboxes();
            renderSheetTable();
        }

        function showForgotForm() {
            document.getElementById('loginFields').classList.add('hidden');
            document.getElementById('forgotFields').classList.remove('hidden');
            document.getElementById('loginFormTitle').innerText = translations[currentLang].forgot_pass_link;
        }

        function showLoginForm() {
            document.getElementById('forgotFields').classList.add('hidden');
            document.getElementById('loginFields').classList.remove('hidden');
            document.getElementById('loginFormTitle').innerText = translations[currentLang].login;
            document.getElementById('forgotMsg').style.display = 'none';
        }

        function resetPassword() {
            const u = document.getElementById('forgotUsername').value;
            const c = document.getElementById('forgotContact').value;
            const msg = document.getElementById('forgotMsg');

            let found = users.find(user => user.username === u && user.contact === c);
            if (found) {
                // Generate a temporary new password or prompt
                let newPass = "12345";
                found.password = newPass;
                localStorage.setItem('app_users', JSON.stringify(users));
                msg.style.color = 'green';
                msg.innerText = "Success! Temporary Password is set to: " + newPass;
                msg.style.display = 'block';
            } else {
                msg.style.color = 'red';
                msg.innerText = "Invalid Username or Contact details!";
                msg.style.display = 'block';
            }
        }

        function login() {
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;

            const found = users.find(user => user.username === u && user.password === p);
            if (found) {
                currentUser = found;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('welcomeMsg').innerText = translations[currentLang].welcome + currentUser.username;

                const today = new Date().toISOString().split('T')[0];
                const dateInput = document.getElementById('inputDate');
                if(dateInput) dateInput.value = today;

                if (currentUser.role === 'admin' || currentUser.role === 'master_admin') {
                    document.getElementById('adminNav').classList.remove('hidden');
                    document.getElementById('adminActionBox').classList.remove('hidden');
                    switchTab('userMgmt');
                } else {
                    document.getElementById('adminNav').classList.add('hidden');
                    document.getElementById('adminActionBox').classList.add('hidden');
                    switchTab('dataSheet');
                }
                populateTaskAssignOptions();
                recalculateAllRows();
                renderSheetTable();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));

            if (tabName === 'userMgmt') {
                document.getElementById('userMgmtTab').classList.remove('hidden');
            } else if (tabName === 'taskMgmt') {
                document.getElementById('taskMgmtTab').classList.remove('hidden');
                renderMasterTaskList();
            } else if (tabName === 'dataSheet') {
                document.getElementById('dataSheetTab').classList.remove('hidden');
                recalculateAllRows();
                renderSheetTable();
            }
        }

        function renderPermissionsCheckboxes() {
            const container = document.getElementById('colPermissions');
            container.innerHTML = '';
            colKeys.forEach(key => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <input type="checkbox" id="chk_${key}" value="${key}" checked>
                    <label for="chk_${key}">${translations[currentLang].cols[key]}</label>
                `;
                container.appendChild(div);
            });
        }

        function createUser() {
            const u = document.getElementById('newUsername').value;
            const p = document.getElementById('newPassword').value;
            const c = document.getElementById('newContact').value;
            const r = document.getElementById('newUserRole').value;

            if (!u || !p || !c) return alert("Please fill username, password and contact!");

            const selectedRights = [];
            colKeys.forEach(key => {
                if (document.getElementById(`chk_${key}`).checked) {
                    selectedRights.push(key);
                }
            });

            const existingIdx = users.findIndex(user => user.username === u);
            if (existingIdx >= 0) {
                users[existingIdx] = { username: u, password: p, contact: c, role: r, rights: selectedRights };
            } else {
                users.push({ username: u, password: p, contact: c, role: r, rights: selectedRights });
            }

            localStorage.setItem('app_users', JSON.stringify(users));
            alert("User and Rights saved successfully!");
            populateTaskAssignOptions();
        }

        function addMasterTask() {
            const t = document.getElementById('newTaskName').value;
            if (t) {
                masterTasks.push(t);
                localStorage.setItem('app_tasks', JSON.stringify(masterTasks));
                document.getElementById('newTaskName').value = '';
                renderMasterTaskList();
                populateTaskAssignOptions();
                recalculateAllRows();
            }
        }

        function renderMasterTaskList() {
            const list = document.getElementById('masterTaskList');
            list.innerHTML = '';
            masterTasks.forEach((t, i) => {
                list.innerHTML += `<li>${t} <button class="btn-danger" style="padding:2px 5px;" onclick="removeTask(${i})">X</button></li>`;
            });
        }

        function removeTask(index) {
            masterTasks.splice(index, 1);
            localStorage.setItem('app_tasks', JSON.stringify(masterTasks));
            renderMasterTaskList();
            populateTaskAssignOptions();
            recalculateAllRows();
        }

        function populateTaskAssignOptions() {
            const uSelect = document.getElementById('assignUserSelect');
            const tSelect = document.getElementById('assignTaskSelect');
            if(!uSelect || !tSelect) return;

            uSelect.innerHTML = '';
            users.filter(u => u.role === 'employee').forEach(u => {
                uSelect.innerHTML += `<option value="${u.username}">${u.username}</option>`;
            });

            tSelect.innerHTML = '';
            masterTasks.forEach(t => {
                tSelect.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        // Logic & Calculations for J, K, I, L, M, N, O, R
        function recalculateAllRows() {
            // First calculate J: Count only tasks allotted to that specific employee
            let empTaskCounts = {};
            sheetData.forEach(row => {
                let emp = row.colA;
                if (!empTaskCounts[emp]) empTaskCounts[emp] = 0;
                empTaskCounts[emp]++;
            });

            sheetData.forEach(row => {
                let emp = row.colA;
                let jCount = empTaskCounts[emp] || 1;
                row.colJ = jCount; // J = Total tasks allotted to this specific employee

                let sal = parseFloat(row.colB) || 0;
                row.colC = sal * 0.10;
                row.colD = (row.colC / 30).toFixed(2);
                row.colE = sal * 0.01;
                row.colF = sal * 0.01;

                // K Calculation & Rules
                // If incorrect: K = (Salary * 8%) / 30 / J
                let perTaskInc = 0;
                if (jCount > 0) {
                    perTaskInc = ((sal * 0.08) / 30) / jCount;
                }

                // I Column: If completed, give perTaskInc amount, if incomplete give 0
                let incAmount = 0;
                if (row.colH === 'Completed') {
                    incAmount = parseFloat(perTaskInc.toFixed(2));
                } else {
                    incAmount = 0;
                }
                row.colI = incAmount;
                row.colL = incAmount; // Total Incentive

                // N & O Default deductions if status not selected
                let nDeduct = 0;
                let oDeduct = 0;
                if (!row.colH || row.colH === '') {
                    nDeduct = (sal * 8) / 100 / 60;
                    oDeduct = (sal * 8) / 100 / 60;
                }
                row.colN = nDeduct ? nDeduct.toFixed(2) : 0;
                row.colO = oDeduct ? oDeduct.toFixed(2) : 0;

                // M Column: Eligible to receive = C (10% incentive) - incomplete points deficit - N deduction - O deduction
                // Incomplete point loss = colC (per task value or total deficit) -> let's manage based on instructions:
                let incompleteLoss = (row.colH !== 'Completed') ? (sal * 0.10 / jCount) : 0;
                let mVal = (row.colC - incompleteLoss - parseFloat(row.colN) - parseFloat(row.colO));
                row.colM = mVal > 0 ? mVal.toFixed(2) : 0;

                // R Column: Total incomplete tasks for that employee
                let totalIncomplete = sheetData.filter(r => r.colA === emp && r.colH !== 'Completed').length;
                row.colR = totalIncomplete;
            });

            localStorage.setItem('app_sheet_data', JSON.stringify(sheetData));
        }

        function assignDailyTask() {
            const dt = document.getElementById('inputDate').value;
            const u = document.getElementById('assignUserSelect').value;
            const sal = parseFloat(document.getElementById('inputSalary').value) || 0;
            const t = document.getElementById('assignTaskSelect').value;
            const inputStatus = document.getElementById('inputStatusSelect').value;

            if (!dt) return alert("Please select a date!");

            sheetData.push({
                dateCol: dt,
                colA: u, 
                colB: sal, 
                colC: sal * 0.10, 
                colD: 0, 
                colE: 0, 
                colF: 0, 
                colG: t, 
                colH: 'Incomplete', 
                colI: 0, 
                colJ: 0, 
                colK: inputStatus, 
                colL: 0, 
                colM: 0, 
                colN: 0, 
                colO: 0,
                colQ: '',
                colR: 0
            });

            recalculateAllRows();
            alert("Daily Task & Entry Added Successfully!");
            renderSheetTable();
        }

        function renderSheetTable() {
            recalculateAllRows();
            const headerTr = document.getElementById('tableHeader');
            const bodyTb = document.getElementById('tableBody');
            headerTr.innerHTML = '';
            bodyTb.innerHTML = '';

            const userRights = (currentUser.role === 'admin' || currentUser.role === 'master_admin') ? colKeys : currentUser.rights;

            colKeys.forEach(colKey => {
                if (userRights.includes(colKey)) {
                    headerTr.innerHTML += `<th>${translations[currentLang].cols[colKey]}</th>`;
                }
            });

            const visibleRows = (currentUser.role === 'admin' || currentUser.role === 'master_admin') ? sheetData : sheetData.filter(row => row.colA === currentUser.username);

            visibleRows.forEach((row, rowIndex) => {
                let tr = document.createElement('tr');
                colKeys.forEach(colKey => {
                    if (userRights.includes(colKey)) {
                        let td = document.createElement('td');
                        
                        let isEditable = true;
                        if (currentUser.role === 'employee') {
                            // Employees can edit H (Completed/Incomplete) and Q (Note)
                            if (colKey !== 'colH' && colKey !== 'colQ') {
                                isEditable = false; 
                            }
                        }

                        if (!isEditable) {
                            td.innerText = row[colKey] !== undefined ? row[colKey] : '';
                        } else {
                            if (colKey === 'colH') {
                                td.innerHTML = `
                                    <select onchange="updateCellData(${rowIndex}, '${colKey}', this.value)">
                                        <option value="Incomplete" ${row[colKey] === 'Incomplete' ? 'selected' : ''}>Incomplete</option>
                                        <option value="Completed" ${row[colKey] === 'Completed' ? 'selected' : ''}>Completed</option>
                                    </select>
                                `;
                            } else if (colKey === 'colK' && (currentUser.role === 'admin' || currentUser.role === 'master_admin')) {
                                td.innerHTML = `
                                    <select onchange="updateCellData(${rowIndex}, '${colKey}', this.value)">
                                        <option value="correct" ${row[colKey] === 'correct' ? 'selected' : ''}>correct</option>
                                        <option value="incorrect" ${row[colKey] === 'incorrect' ? 'selected' : ''}>incorrect</option>
                                    </select>
                                `;
                            } else {
                                td.innerHTML = `<input type="text" value="${row[colKey] || ''}" onchange="updateCellData(${rowIndex}, '${colKey}', this.value)">`;
                            }
                        }
                        tr.appendChild(td);
                    }
                });
                bodyTb.appendChild(tr);
            });
        }

        function updateCellData(rowIndex, colKey, value) {
            const visibleRows = (currentUser.role === 'admin' || currentUser.role === 'master_admin') ? sheetData : sheetData.filter(row => row.colA === currentUser.username);
            visibleRows[rowIndex][colKey] = value;

            recalculateAllRows();
            renderSheetTable();
        }

        function saveSheetData() {
            recalculateAllRows();
            alert("Data saved successfully!");
        }

        renderPermissionsCheckboxes();
    </script>
</body>
</html>
